name: advent2026-local

services:
  sql:
    build:
      context: .
      dockerfile: deploy/local-sql.Dockerfile
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - sql-data:/var/opt/mssql
      - local-secrets:/run/advent-secrets
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$(cat /run/advent-secrets/sa-password)\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s

  schema:
    build:
      context: .
      dockerfile: deploy/database.Dockerfile
    volumes:
      - local-secrets:/run/advent-secrets:ro
    networks: [data]
    depends_on:
      sql: { condition: service_healthy }
    restart: "no"

  provision:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    entrypoint: ["/bin/sh", "/usr/local/bin/local-api-entrypoint.sh"]
    command: ["admin", "provision-db"]
    environment:
      INITIAL_ADMIN_EMAIL: "${LOCAL_ADMIN_EMAIL:-admin@localhost.test}"
      INITIAL_ADMIN_PASSWORD: "${LOCAL_ADMIN_PASSWORD:-Advent2026!Local}"
    volumes:
      - local-secrets:/run/advent-secrets:ro
    networks: [data]
    depends_on:
      schema: { condition: service_completed_successfully }
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    entrypoint: ["/bin/sh", "/usr/local/bin/local-api-entrypoint.sh"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      AllowedHosts: "localhost;127.0.0.1"
      DataProtection__Path: /keys
    volumes:
      - local-secrets:/run/advent-secrets:ro
      - api-keys:/keys
    networks: [web, data]
    depends_on:
      provision: { condition: service_completed_successfully }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt: [no-new-privileges:true]

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    networks: [web]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: [no-new-privileges:true]

networks:
  web:
  data:
    internal: true

volumes:
  sql-data:
  local-secrets:
  api-keys:
